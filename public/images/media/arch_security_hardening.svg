<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <filter id="glow-sec" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="6" flood-color="#0F172A" flood-opacity="0.05" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="500" rx="8" fill="#FAFAFA" stroke="#E5E5E5" stroke-width="1.5" />

  <!-- Blueprint Pattern -->
  <pattern id="grid-pattern-sec" width="20" height="20" patternUnits="userSpaceOnUse">
    <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#EAEAEA" stroke-width="0.75" />
  </pattern>
  <rect width="800" height="500" fill="url(#grid-pattern-sec)" opacity="0.7" />

  <!-- Header -->
  <g transform="translate(32, 28)">
    <rect width="82" height="20" rx="4" fill="#ECFDF5" stroke="#A7F3D0" stroke-width="1" />
    <text x="41" y="14" font-family="'IBM Plex Mono', monospace" font-size="9" font-weight="600" fill="#047857" text-anchor="middle">SPEC // 04</text>
    <text x="96" y="15" font-family="'IBM Plex Mono', monospace" font-size="14" font-weight="600" fill="#242424">Production Defense-in-Depth &amp; Next.js Security Architecture</text>
  </g>

  <!-- 3 Security Perimeter Layers -->
  <!-- LAYER 1: Client Perimeter & Browser Enforcements -->
  <g transform="translate(40, 85)">
    <rect width="210" height="340" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" filter="url(#glow-sec)" />
    <rect width="210" height="42" rx="8" fill="#F8FAFC" />
    <path d="M 0 42 L 210 42" stroke="#E2E8F0" stroke-width="1" />
    <circle cx="20" cy="21" r="5" fill="#3B82F6" />
    <text x="34" y="25" font-family="'IBM Plex Mono', monospace" font-size="12" font-weight="600" fill="#0F172A">1. Client Perimeter</text>

    <g transform="translate(16, 56)">
      <rect width="178" height="66" rx="6" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1" />
      <text x="12" y="20" font-family="'IBM Plex Mono', monospace" font-size="9.5" font-weight="600" fill="#0F172A">Noopener / Noreferrer</text>
      <text x="12" y="38" font-family="system-ui, sans-serif" font-size="8.5" fill="#64748B">Tab-Nabbing Defense</text>
      <text x="12" y="52" font-family="'IBM Plex Mono', monospace" font-size="8" fill="#2563EB">window.opener = null</text>
    </g>

    <g transform="translate(16, 134)">
      <rect width="178" height="90" rx="6" fill="#FEF2F2" stroke="#FECACA" stroke-width="1" />
      <text x="12" y="20" font-family="'IBM Plex Mono', monospace" font-size="9.5" font-weight="600" fill="#DC2626">Clickjacking Barrier</text>
      <text x="12" y="38" font-family="system-ui, sans-serif" font-size="8.5" fill="#7F1D1D">CSP frame-ancestors 'none'</text>
      <text x="12" y="54" font-family="system-ui, sans-serif" font-size="8.5" fill="#7F1D1D">X-Frame-Options: DENY</text>
      <text x="12" y="70" font-family="'IBM Plex Mono', monospace" font-size="8" font-weight="600" fill="#B91C1C">&#8226; Blocks iframe embedding</text>
    </g>

    <g transform="translate(16, 236)">
      <rect width="178" height="74" rx="6" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1" />
      <text x="12" y="20" font-family="'IBM Plex Mono', monospace" font-size="9.5" font-weight="600" fill="#1D4ED8">Permissions Policy</text>
      <text x="12" y="38" font-family="'IBM Plex Mono', monospace" font-size="8" fill="#2563EB">camera=(), microphone=()</text>
      <text x="12" y="52" font-family="'IBM Plex Mono', monospace" font-size="8" fill="#2563EB">geolocation=()</text>
      <text x="12" y="66" font-family="system-ui, sans-serif" font-size="8" fill="#15803D">&#8226; Hardware APIs locked</text>
    </g>
  </g>

  <!-- ARROW 1 -->
  <g transform="translate(250, 180)">
    <line x1="0" y1="0" x2="45" y2="0" stroke="#059669" stroke-width="2" />
    <polygon points="45,0 37,-4 37,4" fill="#059669" />
    <text x="22" y="-8" font-family="'IBM Plex Mono', monospace" font-size="8" fill="#059669" text-anchor="middle">HTTPS_REQ</text>
  </g>

  <!-- LAYER 2: Vercel Edge & Header Shield -->
  <g transform="translate(295, 95)">
    <rect width="210" height="325" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" filter="url(#glow-sec)" />
    <rect width="210" height="42" rx="8" fill="#ECFDF5" />
    <path d="M 0 42 L 210 42" stroke="#D1FAE5" stroke-width="1" />
    <circle cx="20" cy="21" r="5" fill="#10B981" />
    <text x="34" y="25" font-family="'IBM Plex Mono', monospace" font-size="12" font-weight="600" fill="#065F46">2. Edge Header Shield</text>

    <g transform="translate(16, 56)">
      <rect width="178" height="120" rx="6" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1" />
      <text x="10" y="20" font-family="'IBM Plex Mono', monospace" font-size="9.5" font-weight="600" fill="#0F172A">Content-Security-Policy</text>
      <text x="10" y="38" font-family="'IBM Plex Mono', monospace" font-size="8" fill="#475569">default-src 'self'</text>
      <text x="10" y="52" font-family="'IBM Plex Mono', monospace" font-size="8" fill="#475569">script-src 'self' 'unsafe-inline'</text>
      <text x="10" y="66" font-family="'IBM Plex Mono', monospace" font-size="8" fill="#475569">object-src 'none'</text>
      <text x="10" y="80" font-family="'IBM Plex Mono', monospace" font-size="8" fill="#475569">upgrade-insecure-requests</text>
      <text x="10" y="96" font-family="'IBM Plex Mono', monospace" font-size="8" font-weight="600" fill="#059669">&#8226; XSS &amp; injection defense</text>
    </g>

    <g transform="translate(16, 186)">
      <rect width="178" height="60" rx="6" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1" />
      <text x="10" y="20" font-family="'IBM Plex Mono', monospace" font-size="9.5" font-weight="600" fill="#1E40AF">Strict-Transport-Security</text>
      <text x="10" y="38" font-family="'IBM Plex Mono', monospace" font-size="8" fill="#2563EB">max-age=63072000; preload</text>
      <text x="10" y="52" font-family="system-ui, sans-serif" font-size="8" fill="#15803D">&#8226; Enforces HTTPS domain-wide</text>
    </g>

    <g transform="translate(16, 256)">
      <rect width="178" height="50" rx="6" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1" />
      <text x="10" y="20" font-family="'IBM Plex Mono', monospace" font-size="9" font-weight="600" fill="#475569">X-Content-Type-Options</text>
      <text x="10" y="36" font-family="'IBM Plex Mono', monospace" font-size="8" fill="#059669">nosniff (MIME anti-spoof)</text>
    </g>
  </g>

  <!-- ARROW 2 -->
  <g transform="translate(505, 230)">
    <line x1="0" y1="0" x2="45" y2="0" stroke="#059669" stroke-width="2" />
    <polygon points="45,0 37,-4 37,4" fill="#059669" />
    <text x="22" y="-8" font-family="'IBM Plex Mono', monospace" font-size="8" fill="#059669" text-anchor="middle">SAFE_ROUTE</text>
  </g>

  <!-- LAYER 3: Next.js Runtime & Secret Lockdown -->
  <g transform="translate(550, 85)">
    <rect width="210" height="340" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" filter="url(#glow-sec)" />
    <rect width="210" height="42" rx="8" fill="#FAF5FF" />
    <path d="M 0 42 L 210 42" stroke="#F3E8FF" stroke-width="1" />
    <circle cx="20" cy="21" r="5" fill="#8B5CF6" />
    <text x="34" y="25" font-family="'IBM Plex Mono', monospace" font-size="12" font-weight="600" fill="#581C87">3. Runtime Isolation</text>

    <g transform="translate(16, 56)">
      <rect width="178" height="74" rx="6" fill="#F5F3FF" stroke="#DDD6FE" stroke-width="1" />
      <text x="10" y="20" font-family="'IBM Plex Mono', monospace" font-size="9.5" font-weight="600" fill="#6D28D9">Source Map Lockdown</text>
      <text x="10" y="38" font-family="'IBM Plex Mono', monospace" font-size="8" fill="#7C3AED">productionBrowserSourceMaps</text>
      <text x="10" y="52" font-family="'IBM Plex Mono', monospace" font-size="8" font-weight="600" fill="#059669">: false</text>
      <text x="10" y="66" font-family="system-ui, sans-serif" font-size="8" fill="#6B7280">&#8226; Source code unexposed</text>
    </g>

    <g transform="translate(16, 140)">
      <rect width="178" height="74" rx="6" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1" />
      <text x="10" y="20" font-family="'IBM Plex Mono', monospace" font-size="9.5" font-weight="600" fill="#0F172A">No Fingerprinting</text>
      <text x="10" y="38" font-family="'IBM Plex Mono', monospace" font-size="8" fill="#475569">poweredByHeader: false</text>
      <text x="10" y="52" font-family="system-ui, sans-serif" font-size="8" fill="#6B7280">Strips X-Powered-By</text>
      <text x="10" y="66" font-family="'IBM Plex Mono', monospace" font-size="8" fill="#059669">&#8226; Zero server leakage</text>
    </g>

    <g transform="translate(16, 224)">
      <rect width="178" height="84" rx="6" fill="#FEF3C7" stroke="#FDE68A" stroke-width="1" />
      <text x="10" y="20" font-family="'IBM Plex Mono', monospace" font-size="9.5" font-weight="600" fill="#92400E">Secrets &amp; Env Control</text>
      <text x="10" y="38" font-family="system-ui, sans-serif" font-size="8" fill="#78350F">Zero NEXT_PUBLIC_* secrets</text>
      <text x="10" y="54" font-family="system-ui, sans-serif" font-size="8" fill="#78350F">Vercel Server-Side Envs only</text>
      <text x="10" y="70" font-family="'IBM Plex Mono', monospace" font-size="8" font-weight="600" fill="#15803D">&#8226; .env* ignored in git</text>
    </g>
  </g>

  <!-- Bottom Legend Footer -->
  <g transform="translate(40, 460)">
    <text x="0" y="12" font-family="'IBM Plex Mono', monospace" font-size="9" fill="#94A3B8">STATUS: ZERO-TRUST DEFENSE VERIFIED &#8226; CSP &amp; HSTS ACTIVE &#8226; ENTERPRISE HARDENED</text>
  </g>
</svg>
