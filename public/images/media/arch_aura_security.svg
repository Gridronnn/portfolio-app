<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <filter id="glow-auth" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="6" flood-color="#0F172A" flood-opacity="0.05" />
    </filter>
    <linearGradient id="primary-grad-auth" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d55121" />
      <stop offset="100%" stop-color="#ab5232" />
    </linearGradient>
    <linearGradient id="blue-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
    <linearGradient id="emerald-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="500" rx="8" fill="#FAFAFA" stroke="#E5E5E5" stroke-width="1.5" />

  <!-- Grid Blueprint Pattern -->
  <pattern id="grid-pattern" width="20" height="20" patternUnits="userSpaceOnUse">
    <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#EAEAEA" stroke-width="0.75" />
  </pattern>
  <rect width="800" height="500" fill="url(#grid-pattern)" opacity="0.7" />

  <!-- Blueprint Header -->
  <g transform="translate(32, 28)">
    <rect width="82" height="20" rx="4" fill="#faf2f0" stroke="#eddcd8" stroke-width="1" />
    <text x="41" y="14" font-family="'IBM Plex Mono', monospace" font-size="9" font-weight="600" fill="#d55121" text-anchor="middle">SPEC // 01</text>
    <text x="96" y="15" font-family="'IBM Plex Mono', monospace" font-size="14" font-weight="600" fill="#242424">Aura Finance: OAuth 2.0 PKCE &amp; PostgreSQL RLS Architecture</text>
  </g>

  <!-- 3 Main Architecture Columns -->
  <!-- NODE 1: Client Application Layer -->
  <g transform="translate(40, 90)">
    <rect width="210" height="340" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" filter="url(#glow-auth)" />
    <!-- Header -->
    <rect width="210" height="42" rx="8" fill="#F8FAFC" />
    <path d="M 0 42 L 210 42" stroke="#E2E8F0" stroke-width="1" />
    <circle cx="20" cy="21" r="5" fill="#3B82F6" />
    <text x="34" y="25" font-family="'IBM Plex Mono', monospace" font-size="12" font-weight="600" fill="#0F172A">Client App Layer</text>

    <!-- Sub-blocks -->
    <g transform="translate(16, 58)">
      <rect width="178" height="64" rx="6" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="1" />
      <text x="12" y="22" font-family="'IBM Plex Mono', monospace" font-size="10" font-weight="600" fill="#1E293B">PKCE Flow Generator</text>
      <text x="12" y="38" font-family="system-ui, sans-serif" font-size="9.5" fill="#64748B">Code Verifier + S256</text>
      <text x="12" y="52" font-family="'IBM Plex Mono', monospace" font-size="9" fill="#059669">SHA-256 Code Challenge</text>
    </g>

    <g transform="translate(16, 134)">
      <rect width="178" height="64" rx="6" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="1" />
      <text x="12" y="22" font-family="'IBM Plex Mono', monospace" font-size="10" font-weight="600" fill="#1E293B">Session State Manager</text>
      <text x="12" y="38" font-family="system-ui, sans-serif" font-size="9.5" fill="#64748B">HttpOnly Secure Cookies</text>
      <text x="12" y="52" font-family="'IBM Plex Mono', monospace" font-size="9" fill="#2563EB">Short-Lived JWT Bearer</text>
    </g>

    <g transform="translate(16, 210)">
      <rect width="178" height="106" rx="6" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1" />
      <text x="12" y="22" font-family="'IBM Plex Mono', monospace" font-size="10" font-weight="600" fill="#1D4ED8">Telemetry Engine</text>
      <text x="12" y="40" font-family="system-ui, sans-serif" font-size="9.5" fill="#3B82F6">&#8226; Automated budget pacing</text>
      <text x="12" y="58" font-family="system-ui, sans-serif" font-size="9.5" fill="#3B82F6">&#8226; Dynamic wealth charts</text>
      <text x="12" y="76" font-family="system-ui, sans-serif" font-size="9.5" fill="#3B82F6">&#8226; Client PDF/CSV report</text>
      <text x="12" y="94" font-family="system-ui, sans-serif" font-size="9.5" fill="#3B82F6">&#8226; OCR receipt payload</text>
    </g>
  </g>

  <!-- CONNECTOR 1 -->
  <g transform="translate(250, 180)">
    <line x1="0" y1="0" x2="45" y2="0" stroke="#d55121" stroke-width="2" stroke-dasharray="4,3" />
    <polygon points="45,0 37,-4 37,4" fill="#d55121" />
    <text x="22" y="-8" font-family="'IBM Plex Mono', monospace" font-size="8" fill="#d55121" text-anchor="middle">AUTH_TOKEN</text>
  </g>

  <!-- NODE 2: Supabase Auth & Gateway -->
  <g transform="translate(295, 110)">
    <rect width="210" height="300" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" filter="url(#glow-auth)" />
    <!-- Header -->
    <rect width="210" height="42" rx="8" fill="#FAF5FF" />
    <path d="M 0 42 L 210 42" stroke="#F3E8FF" stroke-width="1" />
    <circle cx="20" cy="21" r="5" fill="#8B5CF6" />
    <text x="34" y="25" font-family="'IBM Plex Mono', monospace" font-size="12" font-weight="600" fill="#581C87">Auth Gateway</text>

    <!-- Sub-blocks -->
    <g transform="translate(16, 58)">
      <rect width="178" height="68" rx="6" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1" />
      <text x="12" y="20" font-family="'IBM Plex Mono', monospace" font-size="10" font-weight="600" fill="#0F172A">OAuth Providers</text>
      <text x="12" y="38" font-family="system-ui, sans-serif" font-size="9.5" fill="#64748B">GitHub &amp; Google SSO</text>
      <text x="12" y="54" font-family="'IBM Plex Mono', monospace" font-size="8.5" fill="#7C3AED">Callback /api/auth/v1</text>
    </g>

    <g transform="translate(16, 138)">
      <rect width="178" height="74" rx="6" fill="#F5F3FF" stroke="#DDD6FE" stroke-width="1" />
      <text x="12" y="20" font-family="'IBM Plex Mono', monospace" font-size="10" font-weight="600" fill="#6D28D9">Token Verification</text>
      <text x="12" y="38" font-family="system-ui, sans-serif" font-size="9.5" fill="#6B7280">Asymmetric Key Verif.</text>
      <text x="12" y="54" font-family="system-ui, sans-serif" font-size="9.5" fill="#6B7280">Payload: <tspan font-family="'IBM Plex Mono', monospace" fill="#7C3AED">auth.uid()</tspan></text>
      <text x="12" y="68" font-family="'IBM Plex Mono', monospace" font-size="8.5" fill="#059669">&#8226; Role: authenticated</text>
    </g>

    <g transform="translate(16, 224)">
      <rect width="178" height="54" rx="6" fill="#FEF2F2" stroke="#FECACA" stroke-width="1" />
      <text x="12" y="20" font-family="'IBM Plex Mono', monospace" font-size="9.5" font-weight="600" fill="#DC2626">Security Barrier</text>
      <text x="12" y="36" font-family="system-ui, sans-serif" font-size="9" fill="#7F1D1D">Rate limit: 60 req/min</text>
    </g>
  </g>

  <!-- CONNECTOR 2 -->
  <g transform="translate(505, 230)">
    <line x1="0" y1="0" x2="45" y2="0" stroke="#059669" stroke-width="2" />
    <polygon points="45,0 37,-4 37,4" fill="#059669" />
    <text x="22" y="-8" font-family="'IBM Plex Mono', monospace" font-size="8" fill="#059669" text-anchor="middle">RLS_CONTEXT</text>
  </g>

  <!-- NODE 3: PostgreSQL Database & Row-Level Security -->
  <g transform="translate(550, 90)">
    <rect width="210" height="340" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" filter="url(#glow-auth)" />
    <!-- Header -->
    <rect width="210" height="42" rx="8" fill="#ECFDF5" />
    <path d="M 0 42 L 210 42" stroke="#D1FAE5" stroke-width="1" />
    <circle cx="20" cy="21" r="5" fill="#10B981" />
    <text x="34" y="25" font-family="'IBM Plex Mono', monospace" font-size="12" font-weight="600" fill="#065F46">PostgreSQL (RLS)</text>

    <!-- Sub-blocks -->
    <g transform="translate(16, 56)">
      <rect width="178" height="114" rx="6" fill="#ECFDF5" stroke="#A7F3D0" stroke-width="1" />
      <text x="10" y="20" font-family="'IBM Plex Mono', monospace" font-size="9.5" font-weight="600" fill="#047857">RLS Policy Definition</text>
      <rect x="10" y="30" width="158" height="74" rx="4" fill="#FFFFFF" />
      <text x="16" y="46" font-family="'IBM Plex Mono', monospace" font-size="8" fill="#334155">CREATE POLICY tenant ON</text>
      <text x="16" y="58" font-family="'IBM Plex Mono', monospace" font-size="8" fill="#334155">public.transactions</text>
      <text x="16" y="70" font-family="'IBM Plex Mono', monospace" font-size="8" fill="#2563EB">FOR ALL USING (</text>
      <text x="16" y="84" font-family="'IBM Plex Mono', monospace" font-size="8" fill="#059669">  auth.uid() = user_id</text>
      <text x="16" y="96" font-family="'IBM Plex Mono', monospace" font-size="8" fill="#2563EB">);</text>
    </g>

    <g transform="translate(16, 180)">
      <rect width="178" height="136" rx="6" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1" />
      <text x="10" y="20" font-family="'IBM Plex Mono', monospace" font-size="9.5" font-weight="600" fill="#0F172A">Tables &amp; Vaults</text>
      <text x="10" y="38" font-family="'IBM Plex Mono', monospace" font-size="8.5" fill="#475569">&#8226; transactions (Ledger)</text>
      <text x="10" y="54" font-family="'IBM Plex Mono', monospace" font-size="8.5" fill="#475569">&#8226; budget_goals (Pacing)</text>
      <text x="10" y="70" font-family="'IBM Plex Mono', monospace" font-size="8.5" fill="#475569">&#8226; subscriptions (SaaS)</text>
      <text x="10" y="86" font-family="'IBM Plex Mono', monospace" font-size="8.5" fill="#475569">&#8226; ocr_receipts (Storage)</text>
      <rect x="10" y="100" width="158" height="24" rx="4" fill="#FEF3C7" />
      <text x="89" y="116" font-family="'IBM Plex Mono', monospace" font-size="8" font-weight="600" fill="#B45309" text-anchor="middle">STRICT ZERO-LEAK DATA</text>
    </g>
  </g>

  <!-- Bottom Legend Footer -->
  <g transform="translate(40, 460)">
    <text x="0" y="12" font-family="'IBM Plex Mono', monospace" font-size="9" fill="#94A3B8">STATUS: PRODUCTION ACTIVE &#8226; VERIFIED OAUTH 2.0 PKCE &#8226; ROW-LEVEL SECURITY ENFORCED</text>
  </g>
</svg>
