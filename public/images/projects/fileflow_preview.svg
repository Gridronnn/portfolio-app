          <text x="63" y="131" font-family="system-ui, sans-serif" font-weight="600" font-size="9.5" fill="#047857" text-anchor="middle">Financial Audit</text>

          <rect x="116" y="118" width="76" height="18" rx="4" fill="#F1F5F9" />
          <text x="154" y="131" font-family="system-ui, sans-serif" font-weight="500" font-size="9.5" fill="#64748B" text-anchor="middle">Auto-Tagged</text>
        </g>

        <!-- CARD 2: Legal Master Agreement -->
        <g transform="translate(296, 0)">
          <rect width="280" height="150" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" filter="url(#card-shadow)" />
          <!-- File Icon -->
          <rect x="16" y="16" width="34" height="34" rx="6" fill="#FEE2E2" stroke="#FECACA" stroke-width="1" />
          <text x="33" y="38" font-family="system-ui, sans-serif" font-weight="800" font-size="11" fill="#DC2626" text-anchor="middle">PDF</text>
          
          <text x="60" y="28" font-family="system-ui, sans-serif" font-weight="600" font-size="12.5" fill="#0F172A">Enterprise_MSA_2026.pdf</text>
          <text x="60" y="44" font-family="system-ui, sans-serif" font-size="10.5" fill="#94A3B8">840 KB · Indexed 18m ago</text>

          <rect x="16" y="60" width="248" height="48" rx="6" fill="#F8FAFC" />
          <text x="24" y="78" font-family="system-ui, sans-serif" font-size="10.5" fill="#334155">AI Summary: Standard SaaS liability cap.</text>
          <text x="24" y="94" font-family="system-ui, sans-serif" font-weight="600" font-size="10.5" fill="#7C3AED">Zero non-standard clauses flagged.</text>

          <!-- Badges -->
          <rect x="16" y="118" width="98" height="18" rx="4" fill="#F5F3FF" />
          <text x="65" y="131" font-family="system-ui, sans-serif" font-weight="600" font-size="9.5" fill="#6D28D9" text-anchor="middle">Legal Contract</text>

          <rect x="120" y="118" width="60" height="18" rx="4" fill="#F1F5F9" />
          <text x="150" y="131" font-family="system-ui, sans-serif" font-weight="500" font-size="9.5" fill="#64748B" text-anchor="middle">Verified</text>
        </g>

        <!-- CARD 3: Distributed System Spec -->
        <g transform="translate(0, 166)">
          <rect width="280" height="150" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" filter="url(#card-shadow)" />
          <!-- File Icon -->
          <rect x="16" y="16" width="34" height="34" rx="6" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1" />
          <text x="33" y="38" font-family="system-ui, sans-serif" font-weight="800" font-size="11" fill="#2563EB" text-anchor="middle">MD</text>
          
          <text x="60" y="28" font-family="system-ui, sans-serif" font-weight="600" font-size="12.5" fill="#0F172A">System_Architecture_v4.md</text>
          <text x="60" y="44" font-family="system-ui, sans-serif" font-size="10.5" fill="#94A3B8">120 KB · Indexed 1h ago</text>

          <rect x="16" y="60" width="248" height="48" rx="6" fill="#F8FAFC" />
          <text x="24" y="78" font-family="system-ui, sans-serif" font-size="10.5" fill="#334155">AI Summary: Kafka partition topology</text>
          <text x="24" y="94" font-family="system-ui, sans-serif" font-weight="600" font-size="10.5" fill="#2563EB">with sub-10ms p99 SLA guaranteed.</text>

          <!-- Badges -->
          <rect x="16" y="118" width="124" height="18" rx="4" fill="#EFF6FF" />
          <text x="78" y="131" font-family="system-ui, sans-serif" font-weight="600" font-size="9.5" fill="#1D4ED8" text-anchor="middle">System Architecture</text>
        </g>

        <!-- CARD 4: Machine Learning Inference Script -->
        <g transform="translate(296, 166)">
          <rect width="280" height="150" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" filter="url(#card-shadow)" />
          <!-- File Icon -->
          <rect x="16" y="16" width="34" height="34" rx="6" fill="#FEF3C7" stroke="#FDE68A" stroke-width="1" />
          <text x="33" y="38" font-family="system-ui, sans-serif" font-weight="800" font-size="11" fill="#D97706" text-anchor="middle">PY</text>
          
          <text x="60" y="28" font-family="system-ui, sans-serif" font-weight="600" font-size="12.5" fill="#0F172A">Churn_Prediction_Model.py</text>
          <text x="60" y="44" font-family="system-ui, sans-serif" font-size="10.5" fill="#94A3B8">48 KB · Indexed 2h ago</text>

          <rect x="16" y="60" width="248" height="48" rx="6" fill="#F8FAFC" />
          <text x="24" y="78" font-family="system-ui, sans-serif" font-size="10.5" fill="#334155">AI Summary: XGBoost training pipeline</text>
          <text x="24" y="94" font-family="system-ui, sans-serif" font-weight="600" font-size="10.5" fill="#D97706">achieving 94.2% ROC-AUC score.</text>

