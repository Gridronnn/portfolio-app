    <!-- macOS Style Window Header -->
    <rect width="1160" height="52" rx="12" fill="#FFFFFF" />
    <path d="M 0 52 L 1160 52" stroke="#E2E8F0" stroke-width="1" />

    <!-- Window Controls -->
    <circle cx="28" cy="26" r="5.5" fill="#EF4444" opacity="0.85" />
    <circle cx="46" cy="26" r="5.5" fill="#F59E0B" opacity="0.85" />
    <circle cx="64" cy="26" r="5.5" fill="#10B981" opacity="0.85" />

    <!-- App Brand -->
    <g transform="translate(100, 16)">
      <!-- Logo icon -->
      <rect width="20" height="20" rx="5" fill="url(#primary-grad)" />
      <path d="M5 10 L8.5 13.5 L15 7" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none" />
      <text x="28" y="15" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="14" fill="#0F172A">FileFlow</text>
      <text x="86" y="15" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="14" fill="#4F46E5">AI</text>
      <rect x="110" y="2" width="38" height="16" rx="4" fill="#EEF2FF" stroke="#C7D2FE" stroke-width="1" />
      <text x="129" y="13.5" font-family="system-ui, sans-serif" font-weight="600" font-size="9" fill="#4F46E5" text-anchor="middle">v2.4</text>
    </g>

    <!-- Global Search Bar -->
    <g transform="translate(360, 11)">
      <rect width="440" height="30" rx="6" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1" />
      <circle cx="15" cy="15" r="5" stroke="#94A3B8" stroke-width="1.5" fill="none" />
      <line x1="18.5" y1="18.5" x2="23" y2="23" stroke="#94A3B8" stroke-width="1.5" stroke-linecap="round" />
      <text x="32" y="19" font-family="system-ui, sans-serif" font-size="11" fill="#94A3B8">Search files, smart categories, or natural language prompts...</text>
      <rect x="396" y="6" width="36" height="18" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1" />
      <text x="414" y="18" font-family="system-ui, sans-serif" font-weight="500" font-size="10" fill="#64748B" text-anchor="middle">⌘K</text>
    </g>

    <!-- Top Right Actions -->
    <g transform="translate(930, 12)">
      <!-- Upload button -->
      <rect width="96" height="28" rx="6" fill="url(#primary-grad)" />
      <path d="M12 14 L12 8 M9 11 L12 8 L15 11" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
      <text x="56" y="18" font-family="system-ui, sans-serif" font-weight="600" font-size="11" fill="#FFFFFF" text-anchor="middle">Upload File</text>
      
      <!-- User Avatar -->
      <circle cx="130" cy="14" r="14" fill="#E0E7FF" stroke="#C7D2FE" stroke-width="1.5" />
      <text x="130" y="18" font-family="system-ui, sans-serif" font-weight="700" font-size="11" fill="#4F46E5" text-anchor="middle">AP</text>
      <circle cx="140" cy="22" r="3.5" fill="#10B981" stroke="#FFFFFF" stroke-width="1.5" />
    </g>

    <!-- BODY CONTAINER -->
    <!-- LEFT SIDEBAR -->
    <g transform="translate(0, 52)">
      <rect width="210" height="658" fill="#F8FAFC" />
      <line x1="210" y1="0" x2="210" y2="658" stroke="#E2E8F0" stroke-width="1" />

      <!-- Section Title: WORKSPACES -->
      <text x="24" y="32" font-family="system-ui, sans-serif" font-weight="700" font-size="10" fill="#94A3B8" letter-spacing="0.5">WORKSPACES</text>

      <!-- Sidebar Item: All Files (Active) -->
      <g transform="translate(14, 44)">
        <rect width="182" height="32" rx="6" fill="#EEF2FF" />
        <path d="M14 11 L18 11 L20 13 L26 13 C27.1 13 28 13.9 28 15 L28 21 C28 22.1 27.1 23 26 23 L14 23 C12.9 23 12 22.1 12 21 L12 13 C12 11.9 12.9 11 14 11 Z" stroke="#4F46E5" stroke-width="1.5" fill="none" />
        <text x="36" y="20.5" font-family="system-ui, sans-serif" font-weight="600" font-size="12" fill="#4F46E5">All Documents</text>
        <rect x="146" y="8" width="26" height="16" rx="4" fill="#E0E7FF" />
        <text x="159" y="19.5" font-family="system-ui, sans-serif" font-weight="600" font-size="9.5" fill="#4F46E5" text-anchor="middle">248</text>
      </g>

      <!-- Sidebar Item: Smart Folders -->
      <g transform="translate(14, 82)">
        <circle cx="20" cy="16" r="5" stroke="#64748B" stroke-width="1.5" fill="none" />
        <path d="M20 7 L20 9 M20 23 L20 25 M11 16 L13 16 M27 16 L29 16" stroke="#64748B" stroke-width="1.5" stroke-linecap="round" />
        <text x="36" y="20.5" font-family="system-ui, sans-serif" font-weight="500" font-size="12" fill="#475569">Smart Folders</text>
      </g>

      <!-- Sidebar Item: AI Auto-Tagged -->
      <g transform="translate(14, 118)">
        <path d="M14 11 L20 11 L26 17 L20 23 L14 23 Z" stroke="#64748B" stroke-width="1.5" fill="none" stroke-linejoin="round" />
        <circle cx="17" cy="15" r="1.5" fill="#64748B" />
        <text x="36" y="20.5" font-family="system-ui, sans-serif" font-weight="500" font-size="12" fill="#475569">AI Auto-Tagged</text>
        <rect x="152" y="8" width="20" height="16" rx="4" fill="#F1F5F9" />
        <text x="162" y="19.5" font-family="system-ui, sans-serif" font-weight="600" font-size="9" fill="#64748B" text-anchor="middle">94</text>
      </g>

      <!-- Sidebar Item: Automated Pipelines -->
      <g transform="translate(14, 154)">
        <path d="M14 12 L19 12 L21 16 L25 16 M14 20 L22 20" stroke="#64748B" stroke-width="1.5" stroke-linecap="round" fill="none" />
        <text x="36" y="20.5" font-family="system-ui, sans-serif" font-weight="500" font-size="12" fill="#475569">Agent Workflows</text>
      </g>

