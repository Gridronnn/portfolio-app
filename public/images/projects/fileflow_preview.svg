        <text x="0" y="0" font-family="system-ui, sans-serif" font-weight="700" font-size="11" fill="#94A3B8" letter-spacing="0.5">RECENT AUTOMATIONS</text>

        <!-- Stream Item 1 -->
        <g transform="translate(0, 16)">
          <circle cx="6" cy="10" r="3" fill="#4F46E5" />
          <text x="16" y="10" font-family="system-ui, sans-serif" font-weight="600" font-size="11" fill="#0F172A">Extracted Tax Summary</text>
          <text x="16" y="24" font-family="system-ui, sans-serif" font-size="10" fill="#64748B">Parsed 14 expense receipts · 12m ago</text>
        </g>

        <!-- Stream Item 2 -->
        <g transform="translate(0, 56)">
          <circle cx="6" cy="10" r="3" fill="#10B981" />
          <text x="16" y="10" font-family="system-ui, sans-serif" font-weight="600" font-size="11" fill="#0F172A">Auto-Sorted Invoices</text>
          <text x="16" y="24" font-family="system-ui, sans-serif" font-size="10" fill="#64748B">Moved to /2026/Audits · 45m ago</text>
        </g>

        <!-- Stream Item 3 -->
        <g transform="translate(0, 96)">
          <circle cx="6" cy="10" r="3" fill="#F59E0B" />
          <text x="16" y="10" font-family="system-ui, sans-serif" font-weight="600" font-size="11" fill="#0F172A">PII Redaction Scan</text>
          <text x="16" y="24" font-family="system-ui, sans-serif" font-size="10" fill="#64748B">Scanned 8 contracts: 0 leaks · 2h ago</text>
        </g>
      </g>

      <!-- Natural Language Command Box -->
      <g transform="translate(20, 550)">
        <rect width="290" height="88" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" />
        <text x="14" y="22" font-family="system-ui, sans-serif" font-weight="600" font-size="11" fill="#0F172A">Ask FileFlow Copilot</text>
        <rect x="14" y="32" width="262" height="32" rx="6" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1" />
        <text x="24" y="52" font-family="system-ui, sans-serif" font-size="10.5" fill="#94A3B8">"Find all contracts expiring in Q4..."</text>
        <rect x="242" y="37" width="24" height="22" rx="4" fill="url(#primary-grad)" />
        <path d="M250 48 L255 48 M253 45 L256 48 L253 51" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" fill="none" />
      </g>
    </g>
  </g>
</svg>
