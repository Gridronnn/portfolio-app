        <path d="M12 2 L14 7 L19 9 L14 11 L12 16 L10 11 L5 9 L10 7 Z" fill="#4F46E5" />
        <text x="26" y="14" font-family="system-ui, sans-serif" font-weight="700" font-size="14" fill="#0F172A">FileFlow Intelligence</text>
        <text x="0" y="36" font-family="system-ui, sans-serif" font-size="11" fill="#64748B">Agentic background workflow assistant.</text>
      </g>

      <!-- Active AI Status Banner -->
      <g transform="translate(20, 78)">
