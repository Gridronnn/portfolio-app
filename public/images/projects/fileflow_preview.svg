      <g transform="translate(24, 268)">
        <circle cx="6" cy="10" r="4" fill="#10B981" />
        <text x="18" y="14" font-family="system-ui, sans-serif" font-size="11.5" fill="#334155">Financial Audits</text>
      </g>
      <g transform="translate(24, 298)">
        <circle cx="6" cy="10" r="4" fill="#3B82F6" />
        <text x="18" y="14" font-family="system-ui, sans-serif" font-size="11.5" fill="#334155">ML Models &amp; Data</text>
