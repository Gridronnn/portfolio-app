          <text x="33" y="38" font-family="system-ui, sans-serif" font-weight="800" font-size="11" fill="#059669" text-anchor="middle">XLS</text>
          
          <text x="60" y="28" font-family="system-ui, sans-serif" font-weight="600" font-size="12.5" fill="#0F172A">Q3_Revenue_Forecast.xlsx</text>
          <text x="60" y="44" font-family="system-ui, sans-serif" font-size="10.5" fill="#94A3B8">2.4 MB · Indexed 4m ago</text>

          <rect x="16" y="60" width="248" height="48" rx="6" fill="#F8FAFC" />
          <text x="24" y="78" font-family="system-ui, sans-serif" font-size="10.5" fill="#334155">AI Summary: Cashflow positive with</text>
          <text x="24" y="94" font-family="system-ui, sans-serif" font-weight="600" font-size="10.5" fill="#059669">+18.4% YoY trajectory growth.</text>

          <!-- Badges -->
